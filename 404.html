.nf { min-height: 100vh; min-height: 100svh; display: grid; align-content: center; justify-items: start; gap: 28px; padding: 24px max(24px, 5vw); }

.nf__links { display: flex; gap: 28px; font-size: clamp(16px, 1.4vw, 20px); }
.nf__links a { border-bottom: 1px solid currentColor; padding-bottom: 2px; }
</style>
